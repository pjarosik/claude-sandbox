# Extra host directories mounted into the Claude sandbox, one per line.
#
#   <host>                     mounted read-write at the same path
#   <host>:ro                  mounted read-only at the same path
#   <host>:<container>         mounted read-write at <container>
#   <host>:<container>:ro      mounted read-only at <container>
#
# e.g.  ~/datasets/gan:/data:ro
#
# ~ is expanded on both sides (the container's home is the same path as
# yours). A relative <host> is relative to the directory of this file;
# <container> must be absolute. Paths cannot contain ':'. Missing host paths
# are skipped with a warning (docker would otherwise create them as empty
# root-owned directories).
#
# Always mounted, no need to list them and cannot be remapped: the current
# directory, ~/.claude, ~/.claude.json, ~/.gitconfig (ro) and the claude
# install (ro).
#
# Per project: a .claude-sandbox-mounts file in the project directory, same
# syntax, relative paths relative to the project. It is read before this file
# (so it wins for a container path both map) and only after you approve it:
# the launcher shows it and asks, the first time and whenever it changes.
#
# Override this file with CLAUDE_SANDBOX_MOUNTS=/path/to/other.conf.
# See what a session would get: CLAUDE_SANDBOX_SHOW_MOUNTS=1 claude-sandbox

~/src/auto
~/src/claude-sandbox/.ssh:~/.ssh
